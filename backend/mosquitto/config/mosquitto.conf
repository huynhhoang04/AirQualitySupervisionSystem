listener 1883

# Auth must match application.yml (mqtt.username / mqtt.password).
# The pwfile is generated at container startup (see docker-compose.yml) so no
# hashed secret needs to be committed to the repository.
allow_anonymous false
password_file /mosquitto/auth/pwfile

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
