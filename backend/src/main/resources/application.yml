# AQSS Layer 2 — collect telemetry, serve the dashboard, drive the fan, call Layer 3.
# Every deploy-time value is an environment variable with a working default.
server:
  # SERVER_PORT wins; otherwise honour the platform-injected PORT (Render, Railway, Cloud Run).
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: aqss-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aqss_db}}
    username: ${DB_USER:aqss_user}
    password: ${DB_PASS:aqss_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    # The JSON contract (docs/io_contract.md) is snake_case.
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info

aqss:
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  # Layer 3 (FastAPI). The backend is the caller: threshold, dosage, forecast.
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    timeout-ms: ${AI_TIMEOUT_MS:30000}
    enabled: ${AI_ENABLED:false}
  control:
    cycle-ms: ${CONTROL_CYCLE_MS:60000}
    hysteresis-ratio: ${CONTROL_HYSTERESIS_RATIO:0.7}
    min-on-minutes: ${CONTROL_MIN_ON_MINUTES:5}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}}
    client-id: ${MQTT_CLIENT_ID:aqss-backend}
    username: ${MQTT_USER:aqss_device}
    password: ${MQTT_PASS:aqss_password}
    qos: ${MQTT_QOS:1}

logging:
  level:
    com.aqss.backend: ${LOG_LEVEL_AQSS:INFO}
