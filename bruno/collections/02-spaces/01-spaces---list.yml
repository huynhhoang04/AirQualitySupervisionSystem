info:
  name: 01 - Spaces - List
  type: http
  seq: 1
  tags:
  - spaces
http:
  method: GET
  url: "{{baseUrl}}/api/v1/spaces"
  headers:
  - name: Authorization
    value: "Bearer {{accessToken}}"
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |
      if (!bru.getVar("accessToken")) throw new Error("Missing 'accessToken'. Run '01 - Auth' / '02 - Auth - Token' first.");
  - type: tests
    code: |
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("spaces is a list with a derived threshold", function () {
        expect(res.body).to.be.an("array");
        if (res.body.length > 0) expect(res.body[0].threshold_pm25).to.be.a("number");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only. Space list with the cached ML#1 threshold. Sp_201 is seeded by Flyway V4.
