name: local
variables:
  # Values are quoted on purpose: YAML 1.1 turns an unquoted ON / OFF into a boolean,
  # which would silently corrupt a command payload.
  - name: baseUrl
    value: "http://localhost:8080"
    description: AQSS backend base URL (Render URL when deployed).
  - name: deviceId
    value: "AQSS_ESP32S3_01"
    description: Node id. Seed row from Flyway V1; any node is auto-registered on first telemetry.
  - name: spaceCode
    value: "SP_201"
    description: Space code seeded by Flyway V1 (Phòng 201, 15 m3, bedroom).
