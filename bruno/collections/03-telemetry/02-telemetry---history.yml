info:
  name: 02 - Telemetry - History
  type: http
  seq: 2
  tags:
  - telemetry
http:
  method: GET
  url: "{{baseUrl}}/api/v1/telemetry/history?device_id={{deviceId}}&limit={{historyLimit}}"
  headers:
  - name: Authorization
    value: "Bearer {{accessToken}}"
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |
      if (!bru.getVar("accessToken")) throw new Error("Missing 'accessToken'. Run '01 - Auth' / '02 - Auth - Token' first.");
  - type: tests
    code: |
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("history is a list", function () {
        expect(res.body).to.be.an("array");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only. Raw range query; defaults to the last 24 h when start/end are omitted
  (ISO-8601 instants, e.g. 2026-10-16T00:00:00Z). {{historyLimit}} caps the row count.
