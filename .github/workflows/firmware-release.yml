name: Firmware release

# Tag the repo (git tag fw-v2.1.0 && git push --tags) to publish a flashable image.
on:
  push:
    tags: ["fw-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ESP32-S3 · build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedded
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('embedded/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --quiet platformio

      - name: Build
        run: pio run -e esp32-s3-devkitc-1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AQSS firmware ${{ github.ref_name }}
          files: |
            embedded/.pio/build/esp32-s3-devkitc-1/firmware.bin
            embedded/.pio/build/esp32-s3-devkitc-1/bootloader.bin
            embedded/.pio/build/esp32-s3-devkitc-1/partitions.bin
          body: |
            Flash with:

            ```bash
            esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x0 bootloader.bin \
              0x8000 partitions.bin 0x10000 firmware.bin
            ```

            Or, with the repo checked out: `pio run -e esp32-s3-devkitc-1 -t upload`.

            First boot raises the SoftAP `AQSS-xxxx` / `aqss1234` — join it and open
            http://192.168.4.1 to provision Wi-Fi and the MQTT broker.
