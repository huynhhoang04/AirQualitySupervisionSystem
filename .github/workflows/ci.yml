name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Java 21 · Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests plus the Testcontainers integration test — GitHub runners provide Docker, so
      # PostgreSQL 16 starts for real and the Flyway V1 schema is applied to an empty database.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  backend-image:
    name: Backend · Docker image + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render builds exactly this Dockerfile; fail here instead of during a deploy.
      - name: Build the deploy image
        run: docker build -t aqss-backend:ci backend

      - name: Validate compose file
        working-directory: backend
        run: docker compose config -q

  embedded:
    name: Embedded · ESP32-S3 · PlatformIO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedded
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('embedded/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --quiet platformio

      # include/secrets.h is gitignored, so this is the unprovisioned build — exactly what ships.
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: aqss-firmware
          path: |
            embedded/.pio/build/esp32-s3-devkitc-1/firmware.bin
            embedded/.pio/build/esp32-s3-devkitc-1/bootloader.bin
            embedded/.pio/build/esp32-s3-devkitc-1/partitions.bin
          if-no-files-found: error

  bruno-workspace:
    name: Bruno workspace · conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: pip install --quiet pyyaml

      - name: Validate the workspace
        run: python3 bruno/tools/validate_workspace.py
