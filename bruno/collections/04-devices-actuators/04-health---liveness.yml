info:
  name: 04 - Health - Liveness
  type: http
  seq: 4
  tags:
  - devices
http:
  method: GET
  url: "{{baseUrl}}/actuator/health"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("application is UP", function () {
        expect(res.body.status).to.equal("UP");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only, public (no Authorization). Spring Boot actuator liveness probe - the first
  request to run when you are unsure whether the backend is up at all.
