info:
  name: 01 - Devices - List
  type: http
  seq: 1
  tags:
  - devices
http:
  method: GET
  url: "{{baseUrl}}/api/v1/devices"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("snake_case device fields", function () {
        expect(res.body).to.be.an("array");
        if (res.body.length) expect(res.body[0]).to.have.property("device_id");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  All devices with live fan state. A node is registered the first time it publishes telemetry.
