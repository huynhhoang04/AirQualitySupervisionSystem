[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB QIO flash + 8 MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Wno-unused-parameter

lib_deps =
    sensirion/Sensirion I2C SCD4x@^1.1.0
    olikraus/U8g2@^2.35.30
    arduino-libraries/ArduinoMqttClient@^0.1.8
    bblanchon/ArduinoJson@^7.4.2

; Wi-Fi / MQTT credentials can be injected at build time instead of editing config.h:
;   pio run -e esp32-s3-devkitc-1 -DWIFI_SSID='"lab-wifi"' -DWIFI_PASSWORD='"secret"' \
;           -DMQTT_SERVER='"192.168.1.100"' -DMQTT_USER='"aqss_device"' -DMQTT_PASSWORD='"aqss_password"'
